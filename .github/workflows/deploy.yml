name: ✅ Quality Check (TypeScript + Build)

# Hostinger का अपना Auto-deployment GitHub से connected है —
# यह workflow सिर्फ code quality gate है।
# TypeScript या build fail हो तो deploy रुक जाए।

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔍 TypeScript & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: 🔍 TypeScript check
        run: npx tsc --noEmit

      - name: 🏗️ Build check
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          AUTH_SECRET: "github-actions-build-secret-only"
          NEXT_PUBLIC_SITE_URL: "https://nys.org.in"

      - name: ✅ Summary
        if: success()
        run: |
          echo "## ✅ Quality Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "TypeScript और Build दोनों ✓" >> $GITHUB_STEP_SUMMARY
          echo "Hostinger auto-deploy शुरू हो गया होगा 🚀" >> $GITHUB_STEP_SUMMARY
